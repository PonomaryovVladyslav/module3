{% extends 'base.html' %}

{% block title %}Add new product{% endblock %}

{% block content %}
    <div class="container">
        <h1>Edit product {{ object.name }}</h1>
    </div>

    <form method="post" action="{% url 'edit_product' object.id %}" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Edit product</button>
    </form>
{% endblock %}
