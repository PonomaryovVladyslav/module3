{% extends 'base.html' %}

{% block title %}Add new product{% endblock %}

{% block content %}
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="page-title">Add new product</h1>
      <form class="auth-form" method="post" action="{% url 'add_product' %}" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-block">Add product</button>
      </form>
    </div>
  </div>
{% endblock %}
