{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="page-title">Login</h1>
      <form class="auth-form" method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-block">Login</button>
      </form>
    </div>
  </div>
{% endblock %}
